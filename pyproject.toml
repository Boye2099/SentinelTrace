[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentineltrace"
version = "1.0.0"
description = "Security log intelligence and authentication threat detection engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
sentineltrace = "sentineltrace.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]